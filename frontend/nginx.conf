server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://keittokirja-backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # If serve_images_from_backend is enabled in the
    # backend config, so recipe images are also proxied through.
    location /recipes/img/ {
        proxy_pass http://keittokirja-backend:8000/recipes/img/;
        proxy_set_header Host $host;
    }

    # React Router uses client-side routing — any path that isn't a real file
    # (e.g. /recipes/123 on a hard refresh) falls back to index.html so the
    # app's router can handle it, instead of nginx 404ing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache hashed build assets aggressively; Vite fingerprints filenames so
    # a new deploy gets new filenames automatically.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
