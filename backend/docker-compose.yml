version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: keittokirja-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: keittokirja
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./keittokirja_migration.sql:/docker-entrypoint-initdb.d/001-init.sql:ro

volumes:
  postgres_data:
