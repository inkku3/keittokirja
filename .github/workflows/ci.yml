name: CI
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  #backend-tests:
  #  runs-on: ubuntu-latest
  #  steps:
  #    - uses: actions/checkout@v4
  #    - name: Set up Python
  #      uses: actions/setup-python@v4
  #      with:
  #        python-version: '3.11'
  #    - name: Install Python deps
  #      run: |
  #        python -m pip install --upgrade pip
  #        pip install -r backend/requirements.txt pytest requests beautifulsoup4
  #    - name: Run backend tests
  #      working-directory: ./
  #      run: |
  #        # Run all backend unit, repository and endpoint tests.
  #        # E2E smoke tests that require network/HTTP clients are skipped by default if dependencies are missing.
  #        python -m pytest -q backend/tests

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend deps
        working-directory: frontend
        run: |
          npm ci
      - name: Run frontend unit tests
        working-directory: frontend
        run: |
          npm test

  # Build and push images to GHCR — only on push to main/master, after tests pass.
  # Tags with the commit SHA (not :latest) so ArgoCD Image Updater can track
  # immutable, traceable builds. See deployment guide for the Image Updater side.
  build-backend:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    needs: build-frontend
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./Dockerfile.backend
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/keittokirja-backend:sha-${{ github.sha }}

  build-frontend:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    needs: frontend-tests
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./Dockerfile.frontend
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/keittokirja-frontend:sha-${{ github.sha }}
