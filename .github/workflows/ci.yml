name: CI
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest requests beautifulsoup4
      - name: Run backend tests
        working-directory: ./
        run: |
          # Run all backend unit, repository and endpoint tests.
          # E2E smoke tests that require network/HTTP clients are skipped by default if dependencies are missing.
          python -m pytest -q backend/tests

  frontend-tests:
    runs-on: ubuntu-latest
    needs: backend-tests
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      - name: Install frontend deps
        working-directory: frontend
        run: |
          npm ci
          # Ensure testing libs are available (in case package-lock differs)
          npm install --no-save --no-audit --no-fund jest ts-jest @types/jest @testing-library/react @testing-library/jest-dom @testing-library/user-event jest-environment-jsdom
      - name: Run frontend unit tests
        working-directory: frontend
        run: |
          npm test

  pwa-checks:
    runs-on: ubuntu-latest
    needs: frontend-tests
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      - name: Install frontend deps
        working-directory: frontend
        run: |
          npm ci
      - name: Validate manifest and icons
        working-directory: frontend
        run: node scripts/validate_manifest.js
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Start frontend preview
        run: |
          nohup npx vite preview --port 8004 > frontend-preview.log 2>&1 &
          sleep 3
      - name: Run Lighthouse PWA audit
        run: npx -y lighthouse http://127.0.0.1:8004 --output=json --output-path=./frontend/pwa-lhr.json --chrome-flags="--no-sandbox" --quiet
      - name: Upload Lighthouse report
        uses: actions/upload-artifact@v4
        with:
          name: frontend-pwa-lhr
          path: frontend/pwa-lhr.json

  # Optional Playwright E2E job — runs only when the workflow is dispatched manually (staging)
  playwright-e2e:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: Start backend (uvicorn)
        run: |
          nohup uvicorn backend.main:app --host 127.0.0.1 --port 8000 > backend.log 2>&1 &
          sleep 3
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install frontend deps
        working-directory: frontend
        run: |
          npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Start frontend preview
        run: |
          nohup npx vite preview --port 3000 > frontend.log 2>&1 &
          sleep 3
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
      - name: Run Playwright smoke tests
        run: |
          npx playwright test frontend/tests/e2e/recipe-detail.spec.ts frontend/tests/e2e/search.smoke.spec.ts --reporter=list

  # Build and push images to GHCR — only on push to main/master, after tests pass.
  # Tags with the commit SHA (not :latest) so ArgoCD Image Updater can track
  # immutable, traceable builds. See deployment guide for the Image Updater side.
  build-backend:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    needs: backend-tests
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./Dockerfile.backend
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/recipe-backend:sha-${{ github.sha }}

  build-frontend:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    needs: frontend-tests
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./Dockerfile.frontend
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/recipe-frontend:sha-${{ github.sha }}
